[project]
name = "brain-harness"
version = "0.1.0"
description = "Devin-style Brain agent harness, full-fidelity Python port"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "httpx>=0.27",
    "pydantic>=2",
    "tenacity>=8",
]

[project.scripts]
brain-harness = "brain_harness.demo:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["brain_harness", "brain_harness.context", "brain_harness.tools"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]